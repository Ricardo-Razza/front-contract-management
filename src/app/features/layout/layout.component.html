<button *ngIf="!isSidebarOpen()" class="btn-hamburger" (click)="isSidebarOpen.set(true)" aria-label="Abrir menu"
  title="Abrir menu">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </svg>
</button>

<div class="app-container">
  @if (isSidebarOpen()) {
    <button class="sidebar-backdrop" aria-label="Fechar menu" (click)="closeSidebar()"></button>
  }
  <app-sidebar [isOpen]="isSidebarOpen()" (closeSidebar)="closeSidebar()"></app-sidebar>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <app-toast></app-toast>
</div>
